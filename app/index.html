<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roadmap Graph RAG Chatbot</title>
  <style>
    :root {
      --bg:#f5f7fb; --panel:#fff; --line:#dfe5ef; --text:#172033; --muted:#64748b;
      --blue:#2563eb; --green:#047857; --amber:#b45309; --red:#dc2626; --ink:#111827;
      --shadow:0 16px 42px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
    header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
    .header-inner{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:13px}
    .logo{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:white;background:var(--ink);font-weight:900}
    h1{margin:0;font-size:18px;line-height:1.25}.subtitle{margin-top:2px;color:var(--muted);font-size:13px}
    main{max-width:1280px;margin:0 auto;padding:20px 18px 34px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .profile{padding:16px;display:grid;gap:13px;align-content:start}
    label{display:grid;gap:6px;font-size:13px;font-weight:800}
    select,input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;color:var(--text);background:white}
    textarea{min-height:82px;resize:vertical}
    button{border:0;border-radius:8px;padding:11px 14px;background:var(--blue);color:white;font:inherit;font-weight:900;cursor:pointer}
    button.secondary{color:var(--text);background:#eef2f7}
    .meta{border-top:1px solid var(--line);margin-top:2px;padding-top:12px;color:var(--muted);font-size:12px;line-height:1.55}
    .workspace{display:grid;gap:18px}.chat{min-height:330px;display:grid;grid-template-rows:minmax(260px,1fr) auto}
    .messages{padding:16px;display:grid;gap:12px;align-content:start;max-height:420px;overflow:auto}
    .bubble{max-width:84%;border:1px solid var(--line);border-radius:8px;padding:12px 13px;line-height:1.62;font-size:14px;background:#fff;white-space:pre-wrap}
    .bubble.user{justify-self:end;color:white;border-color:var(--blue);background:var(--blue)}.bubble.bot{justify-self:start;background:#f8fafc}
    .composer{border-top:1px solid var(--line);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.composer textarea{min-height:46px;max-height:120px}
    .result{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{padding:16px}h2{margin:0 0 12px;font-size:16px}
    .list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
    .item strong{display:block;margin-bottom:4px;font-size:14px}.item span{display:block;color:var(--muted);font-size:12px;line-height:1.5}
    .tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;margin-right:5px;color:var(--green);background:#ecfdf5;border:1px solid #a7f3d0;font-size:11px;font-weight:900}
    .tag.missing{color:var(--red);background:#fef2f2;border-color:#fecaca}.tag.core{color:var(--blue);background:#eff6ff;border-color:#bfdbfe}.tag.reach{color:var(--amber);background:#fffbeb;border-color:#fcd34d}
    .graph-panel{grid-column:1/-1;position:relative;overflow:hidden}canvas{width:100%;height:340px;display:block;background:#fbfcff}
    .empty{color:var(--muted);font-size:13px;line-height:1.6}
    @media (max-width:900px){main{grid-template-columns:1fr}.result{grid-template-columns:1fr}.bubble{max-width:100%}.composer{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">R</div>
      <div>
        <h1>울산 고교 과목 로드맵 Graph RAG 챗봇</h1>
        <div class="subtitle">학교 편제표, 학과별 추천 과목, 대학어디가 입시결과 샘플을 연결합니다.</div>
      </div>
    </div>
  </header>

  <main>
    <aside class="panel profile">
      <label>학교<input id="school" list="school-list" value="울산고" /><datalist id="school-list"></datalist></label>
      <label>학년<select id="grade"><option value="1">고1</option><option value="2">고2</option><option value="3">고3</option></select></label>
      <label>내신 평균 등급<input id="school_grade" type="number" min="1" max="9" step="0.01" value="2.7" /></label>
      <label>목표 학과<input id="major" list="major-list" value="컴퓨터공학" /><datalist id="major-list"></datalist></label>
      <label>이수 과목<textarea id="taken">공통수학1, 공통수학2, 통합과학1</textarea></label>
      <button id="quick">조건으로 상담하기</button>
      <button id="sample" class="secondary">생명공학 예시</button>
      <div class="meta" id="meta">데이터 로딩 중</div>
    </aside>

    <section class="workspace">
      <section class="panel chat">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <textarea id="message">울산고 고1이고 내신 2.7, 컴퓨터공학 희망인데 과목이랑 대학 후보 추천해줘</textarea>
          <button id="send">질문</button>
        </div>
      </section>

      <section class="result">
        <article class="panel box"><h2>추천 과목</h2><div class="list" id="available"><div class="empty">아직 상담 결과가 없습니다.</div></div></article>
        <article class="panel box"><h2>확인 필요 과목</h2><div class="list" id="missing"><div class="empty">아직 상담 결과가 없습니다.</div></div></article>
        <article class="panel box"><h2>학기별 로드맵</h2><div class="list" id="plan"><div class="empty">아직 상담 결과가 없습니다.</div></div></article>
        <article class="panel box"><h2>유사 학과</h2><div class="list" id="similar"><div class="empty">아직 상담 결과가 없습니다.</div></div></article>
        <article class="panel box"><h2>대학 추천</h2><div class="list" id="admission"><div class="empty">내신 입력 후 상담하면 표시됩니다.</div></div></article>
        <article class="panel box"><h2>대체 유사 학과/대학</h2><div class="list" id="alternatives"><div class="empty">입시결과 샘플과 연결되면 표시됩니다.</div></div></article>
        <article class="panel graph-panel"><canvas id="graph" width="900" height="340"></canvas></article>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function profile() {
      return {
        school: $("school").value.trim(),
        grade: Number($("grade").value),
        school_grade: Number($("school_grade").value) || null,
        major: $("major").value.trim(),
        taken: $("taken").value.trim()
      };
    }

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = `bubble ${role}`;
      el.textContent = text;
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function loadMeta() {
      try {
        const res = await fetch("/api/meta");
        const meta = await res.json();
        $("meta").textContent = `학교 ${meta.school_count}개, 학과 ${meta.major_count}개, 입시결과 ${meta.admission_result_count}개`;
        $("school-list").innerHTML = meta.schools.map(x => `<option value="${escapeHtml(x)}"></option>`).join("");
        $("major-list").innerHTML = meta.majors.map(x => `<option value="${escapeHtml(x)}"></option>`).join("");
      } catch {
        $("meta").textContent = "서버가 실행 중인지 확인하세요. python server.py";
      }
    }

    async function ask(message) {
      if (!message) return;
      addMessage("user", message);
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message, profile: profile() })
      });
      const data = await res.json();
      addMessage("bot", data.answer || "답변을 생성하지 못했습니다.");
      renderResult(data);
    }

    function renderResult(data) {
      renderSubjects("available", data.available || [], false);
      renderSubjects("missing", data.unavailable || [], true);
      renderPlan(data.plan || []);
      renderSimilar(data.similar_majors || []);
      renderAdmission(data.admission || {});
      drawGraph(data.graph || {nodes: [], edges: []});
    }

    function renderSubjects(id, items, missing) {
      if (!items.length) {
        $(id).innerHTML = `<div class="empty">${missing ? "학교 편제표 기준 확인 필요 과목이 없습니다." : "추천 과목을 찾지 못했습니다."}</div>`;
        return;
      }
      $(id).innerHTML = items.map(item => `
        <div class="item">
          <strong><span class="tag ${missing ? "missing" : "core"}">${escapeHtml(item.recommend_type)}</span>${escapeHtml(item.subject)}</strong>
          <span>${escapeHtml((item.semesters || []).join(", ") || "편제표 내 학기 정보 없음")}</span>
          <span>${escapeHtml(item.evidence || "")}</span>
        </div>`).join("");
    }

    function renderPlan(items) {
      if (!items.length) {
        $("plan").innerHTML = `<div class="empty">학기별 배치 결과가 없습니다.</div>`;
        return;
      }
      $("plan").innerHTML = items.map(item => `
        <div class="item">
          <strong>${escapeHtml(item.semester)}</strong>
          <span>${(item.subjects || []).map(s => `<span class="tag">${escapeHtml(s)}</span>`).join("")}</span>
          <span>${escapeHtml(item.reason || "")}</span>
        </div>`).join("");
    }

    function renderSimilar(items) {
      $("similar").innerHTML = items.length
        ? items.map(item => `<div class="item"><strong>${escapeHtml(item)}</strong><span>학과명/계열 유사도 기반 후보입니다.</span></div>`).join("")
        : `<div class="empty">유사 학과 후보가 없습니다.</div>`;
    }

    function renderAdmission(admission) {
      if (!admission.available) {
        $("admission").innerHTML = `<div class="empty">${escapeHtml(admission.message || "입시결과 데이터가 없습니다.")}</div>`;
        $("alternatives").innerHTML = `<div class="empty">대체 유사 학과 후보가 없습니다.</div>`;
        return;
      }
      const combined = [
        ...(admission.likely || []).map(x => ({...x, bandLabel: "안정"})),
        ...(admission.target || []).map(x => ({...x, bandLabel: "적정"})),
        ...(admission.reach || []).map(x => ({...x, bandLabel: "상향"}))
      ].slice(0, 10);
      $("admission").innerHTML = combined.length ? combined.map(renderAdmissionItem).join("") : `<div class="empty">내신 기준 후보가 없습니다.</div>`;
      $("alternatives").innerHTML = (admission.similar || []).length ? admission.similar.slice(0, 10).map(renderAdmissionItem).join("") : `<div class="empty">대체 유사 학과 후보가 없습니다.</div>`;
    }

    function renderAdmissionItem(item) {
      const grade = item.grade_70 || item.grade_50 || "-";
      const bandClass = item.band === "상향" ? "reach" : item.band === "도전" ? "missing" : "core";
      return `
        <div class="item">
          <strong><span class="tag ${bandClass}">${escapeHtml(item.band || item.bandLabel || "참고")}</span>${escapeHtml(item.university)}</strong>
          <span>${escapeHtml(item.major)} · ${escapeHtml(item.track_name)}</span>
          <span>70% cut ${escapeHtml(grade)} · 경쟁률 ${escapeHtml(item.competition_rate || "-")} · ${escapeHtml(item.match_type || "")}</span>
        </div>`;
    }

    function drawGraph(graph) {
      const canvas = $("graph");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fbfcff";
      ctx.fillRect(0, 0, width, height);
      const nodes = (graph.nodes || []).slice(0, 14);
      if (!nodes.length) {
        ctx.fillStyle = "#64748b";
        ctx.font = "14px system-ui";
        ctx.fillText("상담 결과가 생성되면 근거 그래프가 표시됩니다.", 28, 44);
        return;
      }
      const center = { x: width / 2, y: height / 2 };
      const radius = Math.min(width, height) * 0.34;
      const positioned = {};
      nodes.forEach((node, index) => {
        if (index === 0) positioned[node.id] = { ...node, x: center.x - 230, y: center.y };
        else if (index === 1) positioned[node.id] = { ...node, x: center.x + 210, y: center.y };
        else {
          const angle = ((index - 2) / Math.max(1, nodes.length - 2)) * Math.PI * 2;
          positioned[node.id] = { ...node, x: center.x + Math.cos(angle) * radius, y: center.y + Math.sin(angle) * radius };
        }
      });
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1.4;
      (graph.edges || []).forEach(edge => {
        const a = positioned[edge.source], b = positioned[edge.target];
        if (!a || !b) return;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      });
      Object.values(positioned).forEach(node => {
        ctx.beginPath(); ctx.fillStyle = color(node.type); ctx.arc(node.x, node.y, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "700 11px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(node.label.length > 7 ? node.label.slice(0, 7) : node.label, node.x, node.y);
      });
    }

    function color(type) {
      return {school:"#0e7490", major:"#b45309", available:"#047857", missing:"#dc2626", admission:"#2563eb"}[type] || "#2563eb";
    }

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    $("send").addEventListener("click", () => ask($("message").value.trim()));
    $("quick").addEventListener("click", () => {
      const p = profile();
      ask(`${p.school} 고${p.grade}이고 내신 ${p.school_grade}, ${p.major} 희망입니다. 이수 과목은 ${p.taken}입니다. 과목과 대학 후보를 추천해주세요.`);
    });
    $("sample").addEventListener("click", () => {
      $("major").value = "생명공학";
      $("school_grade").value = "2.9";
      $("taken").value = "공통수학1, 공통수학2, 통합과학1, 통합과학2";
      $("message").value = "울산고 고1이고 내신 2.9, 생명공학 희망인데 대체 유사 학과까지 추천해줘";
    });
    $("message").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) ask($("message").value.trim());
    });

    loadMeta();
    drawGraph({nodes: [], edges: []});
    addMessage("bot", "학교, 학년, 내신, 목표 학과를 넣고 질문해 주세요. 과목 로드맵과 대학어디가 샘플 기반 대학/유사학과 후보를 함께 보여드립니다.");
  </script>
</body>
</html>
